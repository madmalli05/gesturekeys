name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint & smoke tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # NOTE: We do NOT install requirements.txt here. The runtime deps
      # (mediapipe, pyautogui, pycaw, screen-brightness-control) are
      # Windows- and webcam-bound and are not needed for these checks.
      - name: Install dev tooling
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      # Format-check is intentionally not enforced yet: the legacy modules
      # predate `ruff format`. Run `ruff format .` locally to adopt it, then
      # add `ruff format --check .` here.

      - name: Pytest (hardware-free smoke tests)
        run: pytest

  frontend:
    name: Type-check & build (ui-tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui-tauri/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Builds the web frontend (tsc + vite). This does NOT build the Tauri
      # Rust shell, which needs system webkit/webcam libs and is best run
      # locally on Windows. See CONTRIBUTING.md for adding full Tauri CI.
      - name: Build web frontend
        run: npm run build
